ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
locale:
  preference: zh
agent-default-model:
  provider: freellmapi
  model: auto:coding
llm-pi-ai:
  providers:
    opencode:
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/v1
      models:
        - id: mimo-v2.5-free
          name: MiMo V2.5 Free (opencode)
          contextWindow: 200000
          maxTokens: 32000
        - id: nemotron-3-ultra-free
          name: Nemotron 3 Ultra Free (opencode)
          contextWindow: 1000000
          maxTokens: 128000
      retryPolicy:
        mode: normal
        maxRetries: 1000
        retryableCodes:
          [
            RATE_LIMIT,
            SERVER,
            TRANSPORT,
            INVALID_REQUEST,
            PI_AI_ERROR,
            EMPTY_RESPONSE,
            TIMEOUT
          ]
        backoff:
          initialDelayMs: 500
          maxDelayMs: 5000
          jitterRatio: 0.1
