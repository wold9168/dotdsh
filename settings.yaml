ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
locale:
  preference: zh
agent-default-model:
  provider: scnet
  model: DeepSeek-V4-Flash
llm-pi-ai:
  providers:
    opencode:
      apiKeyEnv: OPENCODE_API_KEY
      models:
        - id: deepseek-v4-flash-free
          name: DeepSeek V4 Flash Free
          contextWindow: 200000
          maxTokens: 128000
        - id: mimo-v2.5-free
          name: MiMo V2.5 Free
          contextWindow: 200000
          maxTokens: 32000
        - id: nemotron-3-ultra-free
          name: Nemotron 3 Ultra Free
          contextWindow: 1000000
          maxTokens: 128000
    scnet:
      apiKeyEnv: SCNET_API_KEY
      api: openai-completions
      baseURL: https://api.scnet.cn/api/llm/v1
      retryPolicy:
        mode: normal
        maxRetries: 100
        retryableCodes: [ RATE_LIMIT ]
        backoff:
          initialDelayMs: 500
          maxDelayMs: 5000
          jitterRatio: 0.1
      models:
        - id: DeepSeek-V4-Flash
        - id: DeepSeek-V4-Flash-0731
        - id: DeepSeek-V4-Pro
        - id: GLM-5
        - id: GLM-5.1
        - id: GLM-5.2
        - id: Kimi-K2.5
        - id: Kimi-K2.6
        - id: Kimi-K2.7-Code
        - id: Kimi-K3
        - id: MiniMax-M2.5
        - id: MiniMax-M2.7
        - id: MiniMax-M3
        - id: Qwen3.8-Max
    nvidia:
      apiKeyEnv: NVIDIA_API_KEY
      retryPolicy:
        mode: normal
        maxRetries: 100
        retryableCodes: [ RATE_LIMIT ]
        backoff:
          initialDelayMs: 500
          maxDelayMs: 5000
          jitterRatio: 0.1
