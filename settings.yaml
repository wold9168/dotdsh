ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
locale:
  preference: zh
agent-default-model:
  provider: deepseek-official
  model: deepseek-v4-flash
  reasoningEffort: high
llm-pi-ai:
  providers:
    opencode:
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/v1
      models:
        - id: mimo-v2.5-free
          name: MiMo V2.5 Free (opencode)
          contextWindow: 200000
          maxTokens: 32000
        - id: nemotron-3-ultra-free
          name: Nemotron 3 Ultra Free (opencode)
          contextWindow: 1000000
          maxTokens: 128000
      retryPolicy:
        mode: normal
        maxRetries: 1000
        retryableCodes:
          [
            RATE_LIMIT,
            SERVER,
            TRANSPORT,
            INVALID_REQUEST,
            PI_AI_ERROR,
            EMPTY_RESPONSE,
            TIMEOUT
          ]
        backoff:
          initialDelayMs: 500
          maxDelayMs: 5000
          jitterRatio: 0.1
    scnet:
      apiKeyEnv: SCNET_API_KEY
      api: openai-completions
      baseURL: https://api.scnet.cn/api/llm/v1
      models:
        - id: DeepSeek-V4-Flash
          name: DeepSeek V4 Flash (scnet)
          contextWindow: 1048576
          maxTokens: 393216
        - id: DeepSeek-V4-Flash-0731
          name: DeepSeek V4 Flash 0731 (scnet)
          contextWindow: 1048576
          maxTokens: 393216
        - id: DeepSeek-V4-Pro
          name: DeepSeek V4 Pro (scnet)
          contextWindow: 1048576
          maxTokens: 393216
        - id: DeepSeek-V4-Pro-0813
          name: DeepSeek V4 Pro 0813 (scnet)
          contextWindow: 1048576
          maxTokens: 393216
        - id: GLM-5
          name: GLM 5 (scnet)
          contextWindow: 204800
          maxTokens: 131072
        - id: GLM-5.1
          name: GLM 5.1 (scnet)
          contextWindow: 200000
          maxTokens: 131072
        - id: GLM-5.2
          name: GLM 5.2 (scnet)
          contextWindow: 1000000
          maxTokens: 131072
        - id: Kimi-K2.5
          name: Kimi K2.5 (scnet)
          contextWindow: 262144
          maxTokens: 262144
        - id: Kimi-K2.6
          name: Kimi K2.6 (scnet)
          contextWindow: 262144
          maxTokens: 262144
        - id: Kimi-K2.7-Code
