    nvidia:
      apiKeyEnv: NVIDIA_API_KEY
      retryPolicy:
        mode: normal
        maxRetries: 100
        retryableCodes: [ RATE_LIMIT ]
        backoff:
          initialDelayMs: 500
          maxDelayMs: 5000
          jitterRatio: 0.1
