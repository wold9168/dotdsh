        mode: normal
        maxRetries: 1000
        retryableCodes:
          [
            RATE_LIMIT,
            SERVER,
            TRANSPORT,
            INVALID_REQUEST,
            PI_AI_ERROR,
            EMPTY_RESPONSE,
